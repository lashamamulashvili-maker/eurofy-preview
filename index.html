<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EUROFY.ge — ევროპული არჩევანი</title><style>*{box-sizing:border-box}body{margin:0;color:#202522;background:#fff;font-family:Arial,sans-serif}header{border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:4}.top{background:#171717;color:white;text-align:center;padding:9px;font-size:12px}.nav{max-width:1160px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:22px 20px;gap:18px}.logo{font-family:Georgia,serif;font-size:27px;letter-spacing:-1px;cursor:pointer}.logo small{font-size:13px}nav{display:flex;gap:25px}a{color:inherit;text-decoration:none;cursor:pointer}nav a:hover{color:#1a6046}.catalogTools{display:flex;gap:12px;margin:24px 0;flex-wrap:wrap}.catalogTools input{flex:1;min-width:180px;margin:0}.catalogTools select{border:1px solid #d9d9d9;background:white;padding:12px;min-width:160px}.info{line-height:1.9;color:#555;max-width:750px}.noResults{padding:45px 0;color:#777}.actions{display:flex;gap:16px;align-items:center}button{cursor:pointer;border:0;background:#10392c;color:white;padding:13px 23px;border-radius:3px}button:hover{background:#1d5b44}.ghost{background:white;color:#10392c;border:1px solid #d9e1dc}.container{max-width:1160px;margin:auto;padding:0 20px}.hero{background:#f5f2ed;display:grid;grid-template-columns:1fr 1fr;min-height:440px}.heroText{padding:75px 7vw;align-self:center}.eyebrow{letter-spacing:3px;font-size:11px;color:#60756b}.hero h1{font:normal 48px/1.17 Georgia,serif;margin:20px 0}.hero p{line-height:1.7;color:#646c67}.hero img{width:100%;height:440px;object-fit:cover}.section{padding:65px 0}.section h2{font:normal 31px Georgia,serif}.muted{color:#858a86}.categories,.products{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.cat img,.product img{width:100%;height:220px;object-fit:cover;background:#f6f5f2}.cat{text-align:center}.cat h3{font-size:15px;font-weight:400}.product{cursor:pointer}.product h3{font-size:15px;font-weight:400;margin:12px 0 7px}.product p{margin:0;font-size:15px;font-weight:bold}.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;gap:15px}.filters{display:flex;gap:10px;flex-wrap:wrap}.filters button{padding:9px 14px}.panel{max-width:760px;margin:55px auto;padding:20px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:55px;padding:50px 0}.detail img{width:100%;max-height:540px;object-fit:cover}.detail h1{font:normal 35px Georgia,serif}input{padding:13px;border:1px solid #d9d9d9;width:100%;margin:8px 0 18px;font-size:15px}.cartRow{display:flex;align-items:center;gap:20px;border-bottom:1px solid #eee;padding:15px 0}.cartRow img{width:85px;height:85px;object-fit:cover}.cartRow .grow{flex:1}footer{background:#f6f6f4;padding:45px 20px;color:#647168;text-align:center;font-size:13px;margin-top:60px}.hide{display:none!important}@media(max-width:750px){.nav{padding:17px 15px}.logo{font-size:23px}nav{gap:10px;font-size:12px;overflow:auto}.nav{flex-wrap:wrap}.actions{margin-left:auto}.hero{grid-template-columns:1fr}.heroText{padding:45px 25px}.hero h1{font-size:35px}.hero img{height:260px}.categories,.products{grid-template-columns:repeat(2,1fr);gap:12px}.cat img,.product img{height:165px}.section{padding:40px 0}.detail{grid-template-columns:1fr;gap:18px}.bar{align-items:start;flex-direction:column}}/* EUROFY responsive sizing refinement */

</style></head><body><header><div class="top">ევროპული პროდუქცია • მიწოდება საქართველოში • EUROFY.ge Preview</div><div class="nav"><a class="logo" onclick="go('home')">EUROFY<small>.ge</small></a><nav><a onclick="go('home')">მთავარი</a><a onclick="go('catalog')">პროდუქცია</a><a onclick="go('orders')">შეკვეთები</a><a onclick="go('info')">მიწოდება</a></nav><div class="actions"><a onclick="go('cart')">კალათა (<span id="count">0</span>)</a></div></div></header><main id="app"></main><footer>EUROFY.ge © 2026 • სადემონსტრაციო ვერსია • რეალური შეკვეთები და გადახდები არ სრულდება</footer><script>const products=[{id:1,name:'ელეგანტური სავარძელი',cat:'სახლი',price:1290,img:'https://images.unsplash.com/photo-1567538096630-e0c55bd6374c?w=900'},{id:2,name:'კლასიკური მაჯის საათი',cat:'აქსესუარები',price:749,img:'https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=900'},{id:3,name:'უსადენო ყურსასმენები',cat:'ელექტრონიკა',price:329,img:'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=900'},{id:4,name:'ტყავის ჩანთა',cat:'მოდა',price:490,img:'https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=900'},{id:5,name:'დეკორატიული სანათი',cat:'სახლი',price:320,img:'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=900'},{id:6,name:'მინიმალისტური სამკაული',cat:'აქსესუარები',price:190,img:'https://images.unsplash.com/photo-1617038220319-276d3cfab638?w=900'},{id:7,name:'პორტატული კამერა',cat:'ელექტრონიკა',price:990,img:'https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=900'},{id:8,name:'ქალის ფეხსაცმელი',cat:'მოდა',price:260,img:'https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=900'}];let cart=JSON.parse(localStorage.getItem('eurofy_demo_cart')||'[]');let orders=JSON.parse(localStorage.getItem('eurofy_demo_orders')||'[]');let filter='ყველა';let searchText='';let sortBy='default';const gel=n=>n.toLocaleString('en-US')+' ₾';function save(){localStorage.setItem('eurofy_demo_cart',JSON.stringify(cart));document.getElementById('count').textContent=cart.length}function productCards(a){return '<div class="products">'+a.map(p=>'<article class="product" onclick="go(\'product\','+p.id+')"><img src="'+p.img+'" alt=""><h3>'+p.name+'</h3><p>'+gel(p.price)+'</p></article>').join('')+'</div>'}function renderCatalog(){let list=products.filter(p=>(filter==='ყველა'||p.cat===filter)&&p.name.toLocaleLowerCase('ka').includes(searchText.toLocaleLowerCase('ka')));if(sortBy==='low')list.sort((a,b)=>a.price-b.price);if(sortBy==='high')list.sort((a,b)=>b.price-a.price);document.getElementById('catalogResults').innerHTML=list.length?productCards(list):'<div class="noResults">ამ ძიებით პროდუქტი ვერ მოიძებნა.</div>';document.getElementById('resultCount').textContent=list.length+' პროდუქტი'}function updateSearch(v){searchText=v;renderCatalog()}function updateSort(v){sortBy=v;renderCatalog()}function go(page,id){window.scrollTo(0,0);let a=document.getElementById('app');if(page==='home'){a.innerHTML='<section class="hero"><div class="heroText"><div class="eyebrow">EUROFY — EUROPEAN SELECTION</div><h1>ევროპული არჩევანი<br>შენი სახლისთვის</h1><p>აღმოაჩინე ელეგანტური ნივთები, ტექნიკა, მოდა და აქსესუარები ევროპიდან.</p><button onclick="go(\'catalog\')">პროდუქციის ნახვა →</button></div><img src="https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?w=1200" alt=""></section><div class="container section"><div class="bar"><h2>აღმოაჩინე კატეგორიები</h2></div><div class="categories">'+[{name:'სახლი',img:products[0].img},{name:'მოდა',img:products[3].img},{name:'ელექტრონიკა',img:products[2].img},{name:'აქსესუარები',img:products[1].img}].map(c=>'<a class="cat" onclick="filter=\''+c.name+'\';go(\'catalog\')"><img src="'+c.img+'"><h3>'+c.name+'</h3></a>').join('')+'</div></div><div class="container section"><div class="bar"><h2>რჩეული პროდუქტები</h2><a onclick="filter=\'ყველა\';go(\'catalog\')">ყველას ნახვა →</a></div>'+productCards(products.slice(0,4))+'</div>'}else if(page==='catalog'){a.innerHTML='<div class="container section"><div class="eyebrow">EUROFY / CATALOG</div><div class="bar"><h2>პროდუქცია</h2><span class="muted" id="resultCount">'+products.length+' პროდუქტი</span></div><div class="filters">'+['ყველა','სახლი','მოდა','ელექტრონიკა','აქსესუარები'].map(x=>'<button class="'+(filter===x?'':'ghost')+'" onclick="filter=\''+x+'\';go(\'catalog\')">'+x+'</button>').join('')+'</div><div class="catalogTools"><input aria-label="პროდუქტის ძებნა" placeholder="მოძებნე პროდუქტი..." value="'+searchText.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'" oninput="updateSearch(this.value)"><select aria-label="დალაგება" onchange="updateSort(this.value)"><option value="default" '+(sortBy==='default'?'selected':'')+'>სტანდარტული დალაგება</option><option value="low" '+(sortBy==='low'?'selected':'')+'>ფასი: ზრდადობით</option><option value="high" '+(sortBy==='high'?'selected':'')+'>ფასი: კლებადობით</option></select></div><div id="catalogResults"></div></div>';renderCatalog()}else if(page==='product'){let p=products.find(x=>x.id===id);a.innerHTML='<div class="container detail"><img src="'+p.img+'"><div><div class="eyebrow">EUROFY / '+p.cat+'</div><h1>'+p.name+'</h1><h2>'+gel(p.price)+'</h2><p class="muted">ევროპული შერჩევის სადემონსტრაციო პროდუქტი. ფასი და ფოტო საილუსტრაციოა.</p><p>შეკვეთის მართვა ამ ვერსიაში მხოლოდ სატესტო რეჟიმშია.</p><button onclick="cart.push('+p.id+');save();go(\'cart\')">კალათაში დამატება</button></div></div>'}else if(page==='cart'){let total=cart.reduce((s,id)=>s+products.find(p=>p.id===id).price,0);a.innerHTML='<div class="container panel"><h2>ჩემი კალათა</h2>'+(cart.length?cart.map((id,i)=>{let p=products.find(x=>x.id===id);return '<div class="cartRow"><img src="'+p.img+'"><div class="grow">'+p.name+'<p>'+gel(p.price)+'</p></div><button class="ghost" onclick="cart.splice('+i+',1);save();go(\'cart\')">წაშლა</button></div>'}).join('')+'<h3>ჯამი: '+gel(total)+'</h3><button onclick="go(\'checkout\')">შეკვეთის გაფორმება →</button>':'<p>კალათა ცარიელია.</p><button onclick="go(\'catalog\')">პროდუქციის ნახვა</button>')+'</div>'}else if(page==='checkout'){a.innerHTML='<div class="container panel"><h2>სატესტო შეკვეთა</h2><p class="muted">ეს ფორმა არ აგზავნის მონაცემებს სერვერზე. შეიყვანე მხოლოდ გამოგონილი მონაცემები.</p><form onsubmit="event.preventDefault();let no=\'EF-DEMO-\'+(1001+orders.length);orders.push({no:no,items:[...cart],date:new Date().toLocaleDateString(\'ka-GE\')});localStorage.setItem(\'eurofy_demo_orders\',JSON.stringify(orders));cart=[];save();go(\'success\',no)"><label>სახელი (სატესტო)</label><input required placeholder="მაგალითად: გიორგი"><label>ქალაქი</label><input required placeholder="მაგალითად: თბილისი"><button type="submit">სატესტო შეკვეთის დადასტურება</button></form></div>'}else if(page==='success'){a.innerHTML='<div class="container panel"><h2>✓ სატესტო შეკვეთა შექმნილია</h2><p>ნომერი: '+id+'</p><p class="muted">არაფერი შეძენილა და გადახდა არ მომხდარა.</p><button onclick="go(\'orders\')">ჩემი შეკვეთები</button></div>'}else if(page==='info'){a.innerHTML='<div class="container panel"><div class="eyebrow">EUROFY / INFORMATION</div><h2>შეკვეთა და მიწოდება</h2><div class="info"><p>EUROFY-ის მიზანია ევროპული პროდუქციის შეთავაზება საქართველოს მომხმარებლებისთვის.</p><h3>როგორ იმუშავებს შეკვეთა?</h3><p>მომხმარებელი აირჩევს პროდუქტს, გააფორმებს შეკვეთას და მიიღებს მისი დამუშავებისა და მიწოდების სტატუსებს. რეალური შესყიდვისა და ტრანსპორტირების პირობები გამოქვეყნდება სერვისის ამოქმედებამდე.</p><h3>ამჟამინდელი სტატუსი</h3><p>ეს არის Preview ვერსია. ფასები და პროდუქცია სადემონსტრაციოა; რეალური გადახდა, შესყიდვა და მიწოდება არ ხორციელდება.</p></div><button onclick="go(\'catalog\')">კატალოგში დაბრუნება</button></div>'}else if(page==='orders'){a.innerHTML='<div class="container panel"><h2>სატესტო შეკვეთები</h2><p class="muted">მონაცემები ინახება მხოლოდ ამ მოწყობილობის ბრაუზერში.</p>'+(orders.length?orders.map(o=>'<div class="cartRow"><div class="grow"><b>'+o.no+'</b><p>'+o.date+' • '+o.items.length+' პროდუქტი</p></div><span>დემო</span></div>').join(''):'<p>ჯერ შეკვეთები არ არის.</p>')+'</div>'}save()}go('home');</script></body></html>
