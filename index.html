>მიწოდება</a><a onclick="go('faq')">კითხვები</a><a onclick="go('wishlist')">რჩეულები</a><a onclick="go('policy')">პირობები</a></div><p>EUROFY.ge © 2026 • სადემონსტრაციო ვერსია • რეალური შეკვეთები და გადახდები არ სრულდება</p></footer><script>const API_BASE_URL=''; // Set only after dedicated EUROFY API is deployed and tested over HTTPS.
let accountToken=null;let accountUser=null;
const products=[{id:1,name:'ელეგანტური სავარძელი',cat:'სახლი',price:1290,img:'https://images.unsplash.com/photo-1567538096630-e0c55bd6374c?w=900'},{id:2,name:'კლასიკური მაჯის საათი',cat:'აქსესუარები',price:749,img:'https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=900'},{id:3,name:'უსადენო ყურსასმენები',cat:'ელექტრონიკა',price:329,img:'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=900'},{id:4,name:'ტყავის ჩანთა',cat:'მოდა',price:490,img:'https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=900'},{id:5,name:'დეკორატიული სანათი',cat:'სახლი',price:320,img:'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=900'},{id:6,name:'მინიმალისტური სამკაული',cat:'აქსესუარები',price:190,img:'https://images.unsplash.com/photo-1617038220319-276d3cfab638?w=900'},{id:7,name:'პორტატული კამერა',cat:'ელექტრონიკა',price:990,img:'https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=900'},{id:8,name:'ქალის ფეხსაცმელი',cat:'მოდა',price:260,img:'https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=900'}];const categories=["სახლი","მოდა","ელექტრონიკა","აქსესუარები","ფეხსაცმელი","სილამაზე და მოვლა","თავის მოვლის საშუალებები","ჯანმრთელობა და ჰიგიენა","ბავშვები და სათამაშოები","სპორტი და ფიტნესი","ავტომობილი და აქსესუარები","სამზარეულო და ტექნიკა","ავეჯი","ბაღი და ეზო","ინსტრუმენტები და რემონტი","წიგნები და საკანცელარიო","ცხოველების ნივთები","სამგზავრო ნივთები","საათები და სამკაულები","კომპიუტერები და აქსესუარები","ტელეფონები და აქსესუარები"];let cart=JSON.parse(localStorage.getItem('eurofy_demo_cart')||'[]');let orders=JSON.parse(localStorage.getItem('eurofy_demo_orders')||'[]');let filter='ყველა';let searchText='';let sortBy='default';let wishlist=JSON.parse(localStorage.getItem('eurofy_demo_wishlist')||'[]');const gel=n=>n.toLocaleString('en-US')+' ₾';function save(){localStorage.setItem('eurofy_demo_cart',JSON.stringify(cart));document.getElementById('count').textContent=cart.length}function productCards(a){return '<div class="products">'+a.map(p=>'<article class="product" onclick="go(\'product\','+p.id+')"><img src="'+p.img+'" alt=""><h3>'+p.name+'</h3><p>'+gel(p.price)+'</p></article>').join('')+'</div>'}function toggleWishlist(id){wishlist=wishlist.includes(id)?wishlist.filter(x=>x!==id):[...wishlist,id];localStorage.setItem('eurofy_demo_wishlist',JSON.stringify(wishlist));go('wishlist')}function renderCatalog(){let list=products.filter(p=>(filter==='ყველა'||p.cat===filter)&&p.name.toLocaleLowerCase('ka').includes(searchText.toLocaleLowerCase('ka')));if(sortBy==='low')list.sort((a,b)=>a.price-b.price);if(sortBy==='high')list.sort((a,b)=>b.price-a.price);document.getElementById('catalogResults').innerHTML=list.length?productCards(list):'<div class="noResults">ამ ძიებით პროდუქტი ვერ მოიძებნა.</div>';document.getElementById('resultCount').textContent=list.length+' პროდუქტი'}function selectCategory(index){filter=index<0?'ყველა':categories[index]||'ყველა';searchText='';go('catalog');return false}function updateSearch(v){searchText=v;renderCatalog()}function updateSort(v){sortBy=v;renderCatalog()}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function accountNotice(message,error){const n=document.getElementById('accountNotice');if(n){n.textContent=message;n.style.color=error?'#9b3434':'#246547'}}
async function accountSubmit(event,mode){event.preventDefault();if(!API_BASE_URL){accountNotice('რეგისტრაცია და შესვლა დროებით გამორთულია — სერვერი ჯერ არ არის დაკავშირებული.',true);return}
 const form=event.currentTarget;const submit=form.querySelector('button[type=submit]');const email=form.elements.email.value.trim();const password=form.elements.password.value;
 const payload={email,password};if(mode==='register'){payload.fullName=form.elements.fullName.value.trim();payload.phone=form.elements.phone.value.trim();payload.address=form.elements.address.value.trim();if(password!==form.elements.confirmPassword.value){accountNotice('პაროლები არ ემთხვევა.',true);return}}
 submit.disabled=true;
 try{const response=await fetch(API_BASE_URL+'/api/'+(mode==='register'?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),cache:'no-store'});const result=await response.json();if(!response.ok)throw Error(response.status===409?'ეს ელფოსტა უკვე რეგისტრირებულია.':response.status===401?'ელფოსტა ან პაროლი არასწორია.':response.status===429?'ძალიან ბევრი მცდელობაა. სცადე მოგვიანებით.':'მოთხოვნა ვერ შესრულდა.');
 if(mode==='register'){form.reset();accountNotice('რეგისტრაცია დასრულდა. ახლა შეგიძლია შეხვიდე.')}else{accountToken=result.token;accountUser=result.user;go('account')}

function tr(value){if(currentLanguage==='ka')return value;const entry=localeDictionary[value];if(entry)return entry[currentLanguage];const count=value.match(/^(\d+) პროდუქტი$/);if(count)return count[1]+' '+localeDictionary['პროდუქტი'][currentLanguage];if(value.startsWith('კალათა ('))return localeDictionary['კალათა'][currentLanguage]+value.slice('კალათა'.length);if(value.startsWith('ჯამი:'))return (currentLanguage==='en'?'Total:':'Итого:')+value.slice('ჯამი:'.length);if(value.startsWith('ნომერი:'))return (currentLanguage==='en'?'Number:':'Номер:')+value.slice('ნომერი:'.length);return value}
function applyLanguage(){document.querySelector('header').innerHTML=originalHeader;document.querySelector('footer').innerHTML=originalFooter;document.documentElement.lang=currentLanguage;document.title='EUROFY.ge — '+(currentLanguage==='ka'?'ევროპული არჩევანი':currentLanguage==='en'?'European selection':'Европейский выбор');const select=document.getElementById('languageSelect');if(select)select.value=currentLanguage;const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const node of nodes){if(node.parentElement?.closest('script,style,#languageSelect'))continue;const original=node.nodeValue;const clean=original.trim();if(clean){const translated=tr(clean);if(translated!==clean)node.nodeValue=original.replace(clean,translated)}}document.querySelectorAll('[placeholder],[aria-label]').forEach(el=>{for(const attr of ['placeholder','aria-label']){const val=el.getAttribute(attr);if(val&&localeDictionary[val])el.setAttribute(attr,tr(val))}})}
