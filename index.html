let accountToken=null;let accountUser=null;
const products=[{id:1,name:'ელეგანტური სავარძელი',cat:'სახლი',price:1290,img:'https://images.unsplash.com/photo-1567538096630-e0c55bd6374c?w=900'},{id:2,name:'კლასიკური მაჯის საათი',cat:'აქსესუარები',price:749,img:'https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=900'},{id:3,name:'უსადენო ყურსასმენები',cat:'ელექტრონიკა',price:329,img:'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=900'},{id:4,name:'ტყავის ჩანთა',cat:'მოდა',price:490,img:'https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=900'},{id:5,name:'დეკორატიული სანათი',cat:'სახლი',price:320,img:'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=900'},{id:6,name:'მინიმალისტური სამკაული',cat:'აქსესუარები',price:190,img:'https://images.unsplash.com/photo-1617038220319-276d3cfab638?w=900'},{id:7,name:'პორტატული კამერა',cat:'ელექტრონიკა',price:990,img:'https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=900'},{id:8,name:'ქალის ფეხსაცმელი',cat:'მოდა',price:260,img:'https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=900'}];const categories=["სახლი","მოდა","ელექტრონიკა","აქსესუარები","ფეხსაცმელი","სილამაზე და მოვლა","თავის მოვლის საშუალებები","ჯანმრთელობა და ჰიგიენა","ბავშვები და სათამაშოები","სპორტი და ფიტნესი","ავტომობილი და აქსესუარები","სამზარეულო და ტექნიკა","ავეჯი","ბაღი და ეზო","ინსტრუმენტები და რემონტი","წიგნები და საკანცელარიო","ცხოველების ნივთები","სამგზავრო ნივთები","საათები და სამკაულები","კომპიუტერები და აქსესუარები","ტელეფონები და აქსესუარები"];let cart=JSON.parse(localStorage.getItem('eurofy_demo_cart')||'[]');let orders=JSON.parse(localStorage.getItem('eurofy_demo_orders')||'[]');let filter='ყველა';let searchText='';let sortBy='default';let wishlist=JSON.parse(localStorage.getItem('eurofy_demo_wishlist')||'[]');const gel=n=>n.toLocaleString('en-US')+' ₾';function save(){localStorage.setItem('eurofy_demo_cart',JSON.stringify(cart));document.getElementById('count').textContent=cart.length}function productCards(a){return '<div class="products">'+a.map(p=>'<article class="product" onclick="go(\'product\','+p.id+')"><img src="'+p.img+'" alt=""><h3>'+p.name+'</h3><p>'+gel(p.price)+'</p></article>').join('')+'</div>'}function toggleWishlist(id){wishlist=wishlist.includes(id)?wishlist.filter(x=>x!==id):[...wishlist,id];localStorage.setItem('eurofy_demo_wishlist',JSON.stringify(wishlist));go('wishlist')}function renderCatalog(){let list=products.filter(p=>(filter==='ყველა'||p.cat===filter)&&p.name.toLocaleLowerCase('ka').includes(searchText.toLocaleLowerCase('ka')));if(sortBy==='low')list.sort((a,b)=>a.price-b.price);if(sortBy==='high')list.sort((a,b)=>b.price-a.price);document.getElementById('catalogResults').innerHTML=list.length?productCards(list):'<div class="noResults">ამ ძიებით პროდუქტი ვერ მოიძებნა.</div>';document.getElementById('resultCount').textContent=list.length+' პროდუქტი'}function updateSearch(v){searchText=v;renderCatalog()}function updateSort(v){sortBy=v;renderCatalog()}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function accountNotice(message,error){const n=document.getElementById('accountNotice');if(n){n.textContent=message;n.style.color=error?'#9b3434':'#246547'}}
async function accountSubmit(event,mode){event.preventDefault();if(!API_BASE_URL){accountNotice('რეგისტრაცია და შესვლა დროებით გამორთულია — სერვერი ჯერ არ არის დაკავშირებული.',true);return}
 const form=event.currentTarget;const submit=form.querySelector('button[type=submit]');const email=form.elements.email.value.trim();const password=form.elements.password.value;
 const payload={email,password};if(mode==='register'){payload.fullName=form.elements.fullName.value.trim();if(password!==form.elements.confirmPassword.value){accountNotice('პაროლები არ ემთხვევა.',true);return}}
 submit.disabled=true;
 try{const response=await fetch(API_BASE_URL+'/api/'+(mode==='register'?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),cache:'no-store'});const result=await response.json();if(!response.ok)throw Error(response.status===409?'ეს ელფოსტა უკვე რეგისტრირებულია.':response.status===401?'ელფოსტა ან პაროლი არასწორია.':response.status===429?'ძალიან ბევრი მცდელობაა. სცადე მოგვიანებით.':'მოთხოვნა ვერ შესრულდა.');
 if(mode==='register'){form.reset();accountNotice('რეგისტრაცია დასრულდა. ახლა შეგიძლია შეხვიდე.')}else{accountToken=result.token;accountUser=result.user;go('account')}
 }catch(e){accountNotice(e.message||'სერვერთან კავშირი ვერ დამყარდა.',true)}finally{submit.disabled=false}}
async function accountLogout(){if(accountToken&&API_BASE_URL){try{await fetch(API_BASE_URL+'/api/logout',{method:'POST',headers:{Authorization:'Bearer '+accountToken}})}catch{}}accountToken=null;accountUser=null;go('account')}
function go(page,id){window.scrollTo(0,0);let a=document.getElementById('app');if(page==='home'){a.innerHTML='<section class="hero"><div class="heroText"><div class="eyebrow">EUROFY — EUROPEAN SELECTION</div><h1>ევროპული არჩევანი<br>შენი სახლისთვის</h1><p>აღმოაჩინე ელეგანტური ნივთები, ტექნიკა, მოდა და აქსესუარები ევროპიდან.</p><button onclick="go(\'catalog\')">პროდუქციის ნახვა →</button></div><img src="https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?w=1200" alt=""></section><div class="container section"><div class="bar"><h2>აღმოაჩინე კატეგორიები</h2></div><div class="categories">'+categories.map(name=>({name,img:products.find(p=>p.cat===name)?.img})).map(c=>'<a class="cat" onclick="filter=\''+c.name+'\';go(\'catalog\')">'+(c.img?'<img src="'+c.img+'" alt="">':'<div class="categoryPlaceholder">EUROFY</div>')+'<h3>'+c.name+'</h3></a>').join('')+'</div></div><div class="container section"><div class="bar"><h2>რჩეული პროდუქტები</h2><a onclick="filter=\'ყველა\';go(\'catalog\')">ყველას ნახვა →</a></div>'+productCards(products.slice(0,4))+'</div>'}else if(page==='catalog'){a.innerHTML='<div class="container section"><div class="eyebrow">EUROFY / CATALOG</div><div class="bar"><h2>პროდუქცია</h2><span class="muted" id="resultCount">'+products.length+' პროდუქტი</span></div><div class="filters">'+['ყველა',...categories].map(x=>'<button class="'+(filter===x?'':'ghost')+'" onclick="filter=\''+x+'\';go(\'catalog\')">'+x+'</button>').join('')+'</div><div class="catalogTools"><input aria-label="პროდუქტის ძებნა" placeholder="მოძებნე პროდუქტი..." value="'+searchText.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'" oninput="updateSearch(this.value)"><select aria-label="დალაგება" onchange="updateSort(this.value)"><option value="default" '+(sortBy==='default'?'selected':'')+'>სტანდარტული დალაგება</option><option value="low" '+(sortBy==='low'?'selected':'')+'>ფასი: ზრდადობით</option><option value="high" '+(sortBy==='high'?'selected':'')+'>ფასი: კლებადობით</option></select></div><div id="catalogResults"></div></div>';renderCatalog()}else if(page==='account'){const enabled=Boolean(API_BASE_URL);a.innerHTML='<div class="container panel accountPanel"><div class="eyebrow">EUROFY / ACCOUNT</div><h2>ჩემი ანგარიში</h2>'+(accountUser?'<p>გამარჯობა, '+esc(accountUser.full_name||accountUser.email)+'</p><p class="muted">'+esc(accountUser.email)+'</p><button onclick="accountLogout()">გასვლა</button>':'<p class="muted">შექმენი ანგარიში ან შედი არსებულ ანგარიშში.</p>'+(!enabled?'<p class="accountWarning" role="status">სატესტო ვერსია: რეგისტრაცია და შესვლა ჯერ გამორთულია, რადგან მონაცემთა ბაზა და API არ არის გაშვებული. პირადი მონაცემები არ იგზავნება.</p>':'')+'<div class="accountForms"><form onsubmit="accountSubmit(event,\'register\')"><h3>რეგისტრაცია</h3><label>სახელი და გვარი<input name="fullName" autocomplete="name" maxlength="120" required '+(!enabled?'disabled':'')+'></label><label>ელფოსტა<input name="email" type="email" autocomplete="email" maxlength="254" required '+(!enabled?'disabled':'')+'></label><label>პაროლი (მინ. 12 სიმბოლო)<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required '+(!enabled?'disabled':'')+'></label><label>გაიმეორე პაროლი<input name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required '+(!enabled?'disabled':'')+'></label><button type="submit" '+(!enabled?'disabled':'')+'>ანგარიშის შექმნა</button></form><form onsubmit="accountSubmit(event,\'login\')"><h3>შესვლა</h3><label>ელფოსტა<input name="email" type="email" autocomplete="email" required '+(!enabled?'disabled':'')+'></label><label>პაროლი<input name="password" type="password" autocomplete="current-password" required '+(!enabled?'disabled':'')+'></label><button type="submit" '+(!enabled?'disabled':'')+'>შესვლა</button></form></div><p id="accountNotice" role="status" aria-live="polite"></p>')+'</div>'}else if(page==='product'){let p=products.find(x=>x.id===id);a.innerHTML='<div class="container detail"><img src="'+p.img+'"><div><div class="eyebrow">EUROFY / '+p.cat+'</div><h1>'+p.name+'</h1><h2>'+gel(p.price)+'</h2><p class="muted">ევროპული შერჩევის სადემონსტრაციო პროდუქტი. ფასი და ფოტო საილუსტრაციოა.</p><p>შეკვეთის მართვა ამ ვერსიაში მხოლოდ სატესტო რეჟიმშია.</p><button onclick="cart.push('+p.id+');save();go(\'cart\')">კალათაში დამატება</button> <button class="ghost" onclick="toggleWishlist('+p.id+')">'+(wishlist.includes(p.id)?'♥ რჩეულებიდან წაშლა':'♡ რჩეულებში დამატება')+'</button></div></div>'}else if(page==='cart'){let total=cart.reduce((s,id)=>s+products.find(p=>p.id===id).price,0);a.innerHTML='<div class="container panel"><h2>ჩემი კალათა</h2>'+(cart.length?cart.map((id,i)=>{let p=products.find(x=>x.id===id);return '<div class="cartRow"><img src="'+p.img+'"><div class="grow">'+p.name+'<p>'+gel(p.price)+'</p></div><button class="ghost" onclick="cart.splice('+i+',1);save();go(\'cart\')">წაშლა</button></div>'}).join('')+'<h3>ჯამი: '+gel(total)+'</h3><button onclick="go(\'checkout\')">შეკვეთის გაფორმება →</button>':'<p>კალათა ცარიელია.</p><button onclick="go(\'catalog\')">პროდუქციის ნახვა</button>')+'</div>'}else if(page==='checkout'){a.innerHTML='<div class="container panel"><h2>სატესტო შეკვეთა</h2><p class="muted">ეს ფორმა არ აგზავნის მონაცემებს სერვერზე. შეიყვანე მხოლოდ გამოგონილი მონაცემები.</p><form onsubmit="event.preventDefault();let no=\'EF-DEMO-\'+(1001+orders.length);orders.push({no:no,items:[...cart],date:new Date().toLocaleDateString(\'ka-GE\')});localStorage.setItem(\'eurofy_demo_orders\',JSON.stringify(orders));cart=[];save();go(\'success\',no)"><label>სახელი (სატესტო)</label><input required placeholder="მაგალითად: გიორგი"><label>ქალაქი</label><input required placeholder="მაგალითად: თბილისი"><button type="submit">სატესტო შეკვეთის დადასტურება</button></form></div>'}else if(page==='success'){a.innerHTML='<div class="container panel"><h2>✓ სატესტო შეკვეთა შექმნილია</h2><p>ნომერი: '+id+'</p><p class="muted">არაფერი შეძენილა და გადახდა არ მომხდარა.</p><button onclick="go(\'orders\')">ჩემი შეკვეთები</button></div>'}else if(page==='info'){a.innerHTML='<div class="container panel"><div class="eyebrow">EUROFY / INFORMATION</div><h2>შეკვეთა და მიწოდება</h2><div class="info"><p>EUROFY-ის მიზანია ევროპული პროდუქციის შეთავაზება საქართველოს მომხმარებლებისთვის.</p><h3>როგორ იმუშავებს შეკვეთა?</h3><p>მომხმარებელი აირჩევს პროდუქტს, გააფორმებს შეკვეთას და მიიღებს მისი დამუშავებისა და მიწოდების სტატუსებს. რეალური შესყიდვისა და ტრანსპორტირების პირობები გამოქვეყნდება სერვისის ამოქმედებამდე.</p><h3>ამჟამინდელი სტატუსი</h3><p>ეს არის Preview ვერსია. ფასები და პროდუქცია სადემონსტრაციოა; რეალური გადახდა, შესყიდვა და მიწოდება არ ხორციელდება.</p></div><button onclick="go(\'catalog\')">კატალოგში დაბრუნება</button></div>'}else if(page==='wishlist'){a.innerHTML='<div class="container section"><div class="eyebrow">EUROFY / FAVORITES</div><h2>რჩეული პროდუქტები</h2>'+(wishlist.length?productCards(products.filter(p=>wishlist.includes(p.id))):'<p class="muted">რჩეული პროდუქტები ჯერ არ გაქვს. გახსენი პროდუქტი და დაამატე რჩეულებში.</p>')+'<p class="muted">რჩეულები ინახება მხოლოდ ამ ბრაუზერში.</p><button onclick="go(\'catalog\')">პროდუქციის ნახვა</button></div>'}else if(page==='faq'){a.innerHTML='<div class="container panel"><div class="eyebrow">EUROFY / HELP</div><h2>ხშირად დასმული კითხვები</h2><div class="info"><h3>შესაძლებელია უკვე შეკვეთა?</h3><p>არა. საიტი ჯერ სატესტო რეჟიმშია; გადახდა და რეალური შეკვეთა არ ხორციელდება.</p><h3>საიდან ჩამოვა პროდუქცია?</h3><p>EUROFY-ის დაგეგმილი მოდელია ევროპიდან საქართველოში პროდუქციის მიწოდება. კონკრეტული მომწოდებლები მოგვიანებით დადასტურდება.</p><h3>რა ღირს მიწოდება?</h3><p>მიწოდების ტარიფები ჯერ არ არის დადგენილი.</p><h3>შემიძლია ანგარიშის შექმნა?</h3><p>მომხმარებლის ანგარიშების სისტემა მუშავდება და საჯაროდ ჯერ არ არის ჩართული.</p></div></div>'}else if(page==='policy'){a.innerHTML='<div class="container panel"><div class="eyebrow">EUROFY / LEGAL</div><h2>სამართლებრივი ინფორმაცია</h2><div class="info"><p>ეს საიტი წარმოადგენს განვითარების პროცესში მყოფ სადემონსტრაციო ვერსიას და არ იღებს რეალურ შეკვეთებს ან გადახდებს.</p><p>საჯარო გაშვებამდე გამოქვეყნდება დამტკიცებული გამოყენების პირობები, კონფიდენციალურობის პოლიტიკა, დაბრუნებისა და მიწოდების წესები და კომპანიის იურიდიული მონაცემები.</p><p>ამჟამად კალათა, რჩეულები და სატესტო შეკვეთები ინახება მხოლოდ ამ ბრაუზერში.</p></div></div>'}else if(page==='orders'){a.innerHTML='<div class="container panel"><h2>სატესტო შეკვეთები</h2><p class="muted">მონაცემები ინახება მხოლოდ ამ მოწყობილობის ბრაუზერში.</p>'+(orders.length?orders.map(o=>'<div class="cartRow"><div class="grow"><b>'+o.no+'</b><p>'+o.date+' • '+o.items.length+' პროდუქტი</p></div><span>დემო</span></div>').join(''):'<p>ჯერ შეკვეთები არ არის.</p>')+'</div>'}save()}go('home');</script></body></html>
