/* EUROFY silver / graphite design system */
:root{--eurofy-silver:#c5cbd2;--eurofy-graphite:#30343a;--eurofy-ink:#202328;--eurofy-light:#f5f6f8}
body{color:var(--eurofy-ink)}
header{box-shadow:0 3px 18px rgba(30,35,43,.045)}
.top{background:linear-gradient(110deg,#16181c,#515760 53%,#202329);background-size:220% 100%;animation:eurofyMetalShift 14s ease-in-out infinite alternate}
button:not(.ghost){background:linear-gradient(120deg,#292d33,#5d636c 48%,#34383f);box-shadow:0 3px 10px rgba(32,35,40,.1);transition:transform .25s ease,box-shadow .25s ease,filter .25s ease}
button:not(.ghost):hover{background:linear-gradient(120deg,#444950,#7a818b,#373c43);transform:translateY(-2px);box-shadow:0 8px 20px rgba(32,35,40,.18)}
button:active{transform:translateY(0)}
.ghost{color:#34383e;border-color:#cbd0d6;background:#fff}
nav a{transition:color .2s ease,opacity .2s ease}nav a:hover{color:#666d77}
.hero{background:linear-gradient(115deg,#f9fafb 0%,#edf0f3 48%,#fafafa 100%)}
.heroText{animation:eurofyReveal .75s ease-out both}
.hero img{animation:eurofyImageEnter 1s ease-out both}
.product,.cat{transition:transform .3s ease,box-shadow .3s ease}
.product:hover,.cat:hover{transform:translateY(-5px)}
.product img,.cat img{transition:transform .45s ease,filter .35s ease}
.product:hover img,.cat:hover img{filter:brightness(1.035)}
.logo img{transition:filter .3s ease,transform .3s ease}.logo:hover img{filter:contrast(1.12);transform:translateY(-1px)}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #7c8591;outline-offset:3px}
@keyframes eurofyReveal{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes eurofyImageEnter{from{opacity:.55;transform:scale(1.025)}to{opacity:1;transform:scale(1)}}
@keyframes eurofyMetalShift{from{background-position:0 50%}to{background-position:100% 50%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* Silver registration CTA and account forms */
.registerCta{background:linear-gradient(120deg,#e9edf1 0%,#aab2bc 45%,#dce1e7 100%);color:#171a1e!important;border:1px solid #a8b0bb;box-shadow:0 3px 12px rgba(35,40,48,.13);transition:transform .25s ease,box-shadow .25s ease,filter .25s ease}
.registerCta:hover{background:linear-gradient(120deg,#f5f7f9,#c4cbd3 48%,#e6e9ed);color:#111418!important;transform:translateY(-2px);box-shadow:0 7px 18px rgba(35,40,48,.2)}
.accountForms form{background:linear-gradient(155deg,#fff,#f6f7f9);border:1px solid #d7dce2;box-shadow:0 7px 24px rgba(32,38,46,.045);transition:box-shadow .3s ease,transform .3s ease}
.accountForms form:focus-within{box-shadow:0 10px 28px rgba(32,38,46,.1)}
.accountForms input{background:#fff;border-color:#cbd1d9;border-radius:4px;transition:border-color .2s ease,box-shadow .2s ease}
.accountForms input:focus{border-color:#737c88;box-shadow:0 0 0 3px rgba(165,174,185,.2);outline:0}
.accountForms button:not(:disabled){background:linear-gradient(120deg,#272b31,#606771,#343a42)}
@media(prefers-reduced-motion:reduce){.registerCta,.accountForms form,.accountForms input{transition:none!important}}

/* Silver category navigation with gentle interactions */
.categories{border-top:1px solid #cbd1d9}
.categories .cat{position:relative;overflow:hidden;background:linear-gradient(112deg,#fafbfc 0%,#e8ebef 48%,#f9fafb 100%);border:1px solid #d7dce3;border-top:0;padding:13px 15px;transition:background .35s ease,transform .3s ease,box-shadow .3s ease,border-color .3s ease}
.categories .cat::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:linear-gradient(#d9dee5,#828c99,#e2e6eb);opacity:.65;transition:width .3s ease,opacity .3s ease}

.categories .cat:hover::before{width:5px;opacity:1}
.categories .cat h3{color:#333941;transition:color .25s ease,transform .3s ease}
.categories .cat:hover h3{color:#161a20;transform:translateX(2px)}
.categories .cat img,.categories .cat .categoryPlaceholder{border:1px solid #c7cdd5;background:linear-gradient(135deg,#f9fafb,#cbd2db);transition:transform .35s ease,box-shadow .35s ease}

.filters{border-color:#cbd1d9;background:#f8f9fa}
.filters button.ghost{background:linear-gradient(110deg,#fbfcfd,#e9edf1);color:#343a42;transition:background .3s ease,transform .25s ease}
.filters button.ghost:hover{background:linear-gradient(110deg,#e5e9ee,#cdd4dd);transform:translateX(3px)}
.filters button:not(.ghost){background:linear-gradient(120deg,#333840,#777f89,#454b54);color:#fff}

/* EUROFY liquid-silver water ripple for interactive controls */
button,.registerCta,.filters button,nav a,.actions a,.footerLinks a,.categories .cat,.product{position:relative;isolation:isolate}
button,.registerCta,.filters button,.categories .cat{overflow:hidden}
.eurofy-water-ripple{position:absolute;z-index:3;pointer-events:none;border-radius:50%;width:24px;height:24px;left:0;top:0;background:radial-gradient(circle,rgba(255,255,255,.65) 0%,rgba(201,217,231,.38) 33%,rgba(134,165,190,.18) 58%,rgba(255,255,255,0) 72%);border:1px solid rgba(220,234,247,.5);box-shadow:0 0 15px rgba(210,226,239,.2);transform:translate(-50%,-50%) scale(0);animation:eurofyWaterRipple .72s cubic-bezier(.12,.52,.25,1) forwards}

@keyframes eurofyWaterRipple{0%{opacity:.85;transform:translate(-50%,-50%) scale(0)}60%{opacity:.52}100%{opacity:0;transform:translate(-50%,-50%) scale(var(--eurofy-ripple-scale,12))}}

</style></head><body><header><div class="top">ევროპული პროდუქცია • მიწოდება საქართველოში • EUROFY.ge Preview</div><div class="nav"><a class="logo" onclick="go('home')" aria-label="EUROFY.ge — მთავარი გვერდი"><span class="eurofyWordmark">EUROFY<span class="eurofyWordmarkDot">.</span></span></a><nav><a onclick="go('home')">მთავარი</a><a onclick="go('catalog')">პროდუქცია</a><a onclick="go('orders')">შეკვეთები</a><a onclick="go('account')">ანგარიში</a><a onclick="go('info')">მიწოდება</a></nav><form class="storeSearch" role="search" onsubmit="event.preventDefault();storefrontSearch(this.elements.query.value)"><input name="query" aria-label="პროდუქტის ძებნა" placeholder="მოძებნე პროდუქტი, კატეგორია ან ბრენდი..." autocomplete="off"><button type="submit" aria-label="ძებნა">⌕</button></form><div class="actions"><a class="registerCta" onclick="go('account')">რეგისტრაცია</a><select id="languageSelect" class="languageSelect" aria-label="Language" onchange="setLanguage(this.value)"><option value="ka">ქართული</option><option value="en">English</option><option value="ru">Русский</option></select><a onclick="go('cart')">კალათა (<span id="count">0</span>)</a></div></div><div class="storeCategoryStrip" id="storeCategoryStrip"></div></header><main id="app"></main><footer><div class="footerLinks"><a onclick="go('info')">მიწოდება</a><a onclick="go('faq')">კითხვები</a><a onclick="go('wishlist')">რჩეულები</a><a onclick="go('policy')">პირობები</a><a onclick="go('imprint')">Impressum</a><a onclick="go('contact')">კონტაქტი</a></div><p>EUROFY.ge © 2026 • სადემონსტრაციო ვერსია • რეალური შეკვეთები და გადახდები არ სრულდება</p></footer><script>const API_BASE_URL=''; // Set only after dedicated EUROFY API is deployed and tested over HTTPS.
let accountToken=null;let accountUser=null;
const products=[];const categories=["SALE","სახლი","მოდა","ელექტრონიკა","აქსესუარები","ფეხსაცმელი","სილამაზე და მოვლა","თავის მოვლის საშუალებები","ჯანმრთელობა და ჰიგიენა","ბავშვები და სათამაშოები","სპორტი და ფიტნესი","ავტომობილი და აქსესუარები","სამზარეულო და ტექნიკა","ავეჯი","ბაღი და ეზო","ინსტრუმენტები და რემონტი","წიგნები და საკანცელარიო","ცხოველების ნივთები","სამგზავრო ნივთები","საათები და სამკაულები","კომპიუტერები და აქსესუარები","ტელეფონები და აქსესუარები"];let cart=JSON.parse(localStorage.getItem('eurofy_demo_cart')||'[]');let orders=JSON.parse(localStorage.getItem('eurofy_demo_orders')||'[]');let filter='ყველა';let searchText='';let sortBy='default';const brandDirectory=["Chanel","Gucci","Louis Vuitton","Prada","Dior","Hermès","Burberry","Versace","Balenciaga","Saint Laurent","Fendi","Valentino","Armani","Dolce & Gabbana","Bottega Veneta","Givenchy","Celine","Moncler","Max Mara","Michael Kors","Coach","Tommy Hilfiger","Calvin Klein","Ralph Lauren","Hugo Boss","Lacoste","Nike","Adidas","Puma","New Balance","Levi's","Zara","Mango","Samsung","Apple","Sony","Bose","Dyson","Philips","Bosch","Siemens","De'Longhi","Tefal","L'Oréal","Lancôme","Estée Lauder","Nivea","Rolex","Tissot","Casio"];let selectedBrand='';let selectedColor='';let selectedSize='';let brandSearch='';let minPrice='';let maxPrice='';let wishlist=JSON.parse(localStorage.getItem('eurofy_demo_wishlist')||'[]');const gel=n=>n.toLocaleString('en-US')+' ₾';function save(){localStorage.setItem('eurofy_demo_cart',JSON.stringify(cart));document.getElementById('count').textContent=cart.length}function productCards(a){return '<div class="products">'+a.map(p=>'<article class="product" onclick="go(\'product\','+p.id+')"><img src="'+p.img+'" alt=""><h3>'+p.name+'</h3><p>'+gel(p.price)+'</p>'+(p.shippingIncluded===true?'<small class="shippingIncluded">ფასში შედის ტრანსპორტირების ხარჯებიც.</small>':'')+'</article>').join('')+'</div>'}function toggleWishlist(id){wishlist=wishlist.includes(id)?wishlist.filter(x=>x!==id):[...wishlist,id];localStorage.setItem('eurofy_demo_wishlist',JSON.stringify(wishlist));go('wishlist')}function renderCatalog(){const needle=searchText.trim().toLowerCase();let list=products.filter(p=>(filter==='ყველა'||(filter==='SALE'?Number(p.originalPrice)>Number(p.price):p.cat===filter))&&(!selectedBrand||String(p.brand||'').toLowerCase()===selectedBrand.toLowerCase())&&(!selectedColor||(Array.isArray(p.colors)?p.colors:[p.color]).some(c=>String(c||'').toLowerCase()===selectedColor.toLowerCase()))&&(!selectedSize||(Array.isArray(p.sizes)?p.sizes:[p.size]).some(z=>String(z||'').toLowerCase()===selectedSize.toLowerCase()))&&(!minPrice||p.price>=Number(minPrice))&&(!maxPrice||p.price<=Number(maxPrice))&&(!needle||[p.name,p.cat,p.brand||'',(p.colors||[]).join(' '),(p.sizes||[]).join(' '),p.color||'',p.size||'',localeDictionary[p.name]?.en||'',localeDictionary[p.name]?.ru||''].join(' ').toLowerCase().includes(needle)));if(sortBy==='low')list.sort((a,b)=>a.price-b.price);if(sortBy==='high')list.sort((a,b)=>b.price-a.price);document.getElementById('catalogResults').innerHTML=list.length?productCards(list):'<div class="noResults">'+(filter==='SALE'?'ფასდაკლებული პროდუქცია ჯერ არ არის დამატებული.':selectedBrand?'ამ ბრენდის დადასტურებული პროდუქცია ჯერ არ არის დამატებული.':'ამ ძიებით პროდუქტი ვერ მოიძებნა.')+'</div>';document.getElementById('resultCount').textContent=list.length+' პროდუქტი'}function toggleCatalogSidebar(button){const el=document.getElementById('catalogSidebar');if(!el)return;const open=el.classList.toggle('open');button.setAttribute('aria-expanded',String(open))}function updateBrand(v){selectedBrand=v;renderCatalog();applyLanguage()}function updateColor(v){selectedColor=v;renderCatalog();applyLanguage()}function updateSize(v){selectedSize=v;renderCatalog();applyLanguage()}function searchBrands(v){brandSearch=String(v||'');const list=document.getElementById('brandOptions');if(!list)return;const q=brandSearch.trim().toLocaleLowerCase();list.innerHTML=brandDirectory.filter(b=>b.toLocaleLowerCase().includes(q)).map(b=>'<option value="'+esc(b)+'"></option>').join('')}function selectBrandFromSearch(v){brandSearch=String(v||'');const match=brandDirectory.find(b=>b.toLocaleLowerCase()===brandSearch.trim().toLocaleLowerCase());selectedBrand=match||'';renderCatalog()}function updatePrice(which,v){if(which==='min')minPrice=v;else maxPrice=v;renderCatalog();applyLanguage()}function resetFilters(){selectedBrand='';selectedColor='';selectedSize='';brandSearch='';minPrice='';maxPrice='';searchText='';sortBy='default';filter='ყველა';go('catalog')}function browseBrand(index){selectedBrand=brandDirectory[index];filter='ყველა';searchText='';go('catalog')}function selectCategory(index){filter=index<0?'ყველა':categories[index]||'ყველა';searchText='';go('catalog');return false}function updateSearch(v){searchText=v;renderCatalog()}function updateSort(v){sortBy=v;renderCatalog()}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function accountNotice(message,error){const n=document.getElementById('accountNotice');if(n){n.textContent=message;n.style.color=error?'#9b3434':'#246547'}}
async function accountSubmit(event,mode){event.preventDefault();if(!API_BASE_URL){accountNotice('რეგისტრაცია და შესვლა დროებით გამორთულია — სერვერი ჯერ არ არის დაკავშირებული.',true);return}
 const form=event.currentTarget;const submit=form.querySelector('button[type=submit]');const email=form.elements.email.value.trim();const password=form.elements.password.value;
 const payload={email,password};if(mode==='register'){payload.fullName=form.elements.fullName.value.trim();payload.phone=form.elements.phone.value.trim();payload.address=form.elements.address.value.trim();payload.city=form.elements.city.value.trim();if(password!==form.elements.confirmPassword.value){accountNotice('პაროლები არ ემთხვევა.',true);return}}
 submit.disabled=true;
 try{const response=await fetch(API_BASE_URL+'/api/'+(mode==='register'?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),cache:'no-store'});const result=await response.json();if(!response.ok)throw Error(response.status===409?'ეს ელფოსტა უკვე რეგისტრირებულია.':response.status===401?'ელფოსტა ან პაროლი არასწორია.':response.status===429?'ძალიან ბევრი მცდელობაა. სცადე მოგვიანებით.':'მოთხოვნა ვერ შესრულდა.');
 if(mode==='register'){form.reset();accountNotice('რეგისტრაცია დასრულდა. ახლა შეგიძლია შეხვიდე.')}else{accountToken=result.token;accountUser=result.user;go('account')}
 }catch(e){accountNotice(e.message||'სერვერთან კავშირი ვერ დამყარდა.',true)}finally{submit.disabled=false}}
async function accountLogout(){if(accountToken&&API_BASE_URL){try{await fetch(API_BASE_URL+'/api/logout',{method:'POST',headers:{Authorization:'Bearer '+accountToken}})}catch{}}accountToken=null;accountUser=null;go('account')}
async function cabinetLoad(){if(!API_BASE_URL||!accountToken)return;const panel=document.getElementById('customerCabinet');if(!panel)return;try{const headers={Authorization:'Bearer '+accountToken};const [p,o]=await Promise.all([fetch(API_BASE_URL+'/api/profile',{headers,cache:'no-store'}),fetch(API_BASE_URL+'/api/my-orders',{headers,cache:'no-store'})]);if(p.status===401||o.status===401){accountToken=null;accountUser=null;go('account');return}if(!p.ok||!o.ok)throw Error('სერვისთან დაკავშირება ვერ მოხერხდა');const profile=(await p.json()).profile;const orders=(await o.json()).orders||[];if(!document.getElementById('customerCabinet'))return;panel.innerHTML='<h3>ჩემი პროფილი</h3><p class="muted">მომხმარებლის კოდი: '+esc(profile.customer_code||'—')+'</p><form onsubmit="cabinetSave(event)"><label>სახელი და გვარი<input name="fullName" maxlength="120" required value="'+esc(profile.full_name||'')+'"></label><label>ელფოსტა<input disabled value="'+esc(profile.email||'')+'"></label><label>ტელეფონი<input name="phone" maxlength="24" required value="'+esc(profile.phone||'')+'"></label><label>ქალაქი<input name="city" maxlength="120" required value="'+esc(profile.city||'')+'"></label><label>მისამართი<input name="address" maxlength="300" required value="'+esc(profile.address||'')+'"></label><button type="submit">ცვლილებების შენახვა</button></form><p id="cabinetNotice" role="status" aria-live="polite"></p><h3>ჩემი შეკვეთები</h3><p class="muted">რეალური შეკვეთები ჯერ არ მიიღება. აქ გამოჩნდება მხოლოდ სერვერზე დადასტურებული ჩანაწერები.</p>'+(orders.length?orders.map(o=>'<div class="cartRow"><div class="grow"><b>'+esc(o.order_number)+'</b><p>'+esc(o.status)+' • '+esc(o.payment_status)+'</p></div><span>'+Number(o.total_gel_minor/100).toFixed(2)+' ₾</span></div>').join(''):'<p>შეკვეთები ჯერ არ არის.</p>');}catch(e){if(panel)panel.textContent=e.message||'კაბინეტის ჩატვირთვა ვერ მოხერხდა';}}

const eurofyInterests=Object.create(null);
function eurofyRemember(category,weight=1){if(category&&category!=='ყველა'&&category!=='SALE')eurofyInterests[category]=Math.min(50,(eurofyInterests[category]||0)+weight)}
function eurofyShuffle(items){const out=[...items];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
function eurofyHomeProducts(){
 // Prefer 70% relevant / 30% discovery, rounded to available unique products.
 // No interest history means fully shuffled discovery; no duplicate product cards.
 const shuffled=eurofyShuffle(products.filter(p=>p&&p.id!=null));
 const limit=Math.min(10,shuffled.length);
 const interests=Object.entries(eurofyInterests).filter(([,weight])=>weight>0);
 if(!interests.length)return shuffled.slice(0,limit);
 const relevant=shuffled.filter(p=>interests.some(([cat])=>cat===p.cat));
 const other=shuffled.filter(p=>!interests.some(([cat])=>cat===p.cat));
 const targetRelevant=Math.round(limit*0.7);
 const targetDiscovery=limit-targetRelevant;
 const chosen=[...relevant.slice(0,targetRelevant),...other.slice(0,targetDiscovery)];
 const used=new Set(chosen.map(p=>String(p.id)));
 // Fill unused positions if one pool is smaller than its target.
 for(const product of [...relevant.slice(targetRelevant),...other.slice(targetDiscovery)]){
  if(chosen.length>=limit)break;
  if(!used.has(String(product.id))){chosen.push(product);used.add(String(product.id))}
 }
 return eurofyShuffle(chosen);
}

(function eurofyEnableWaterRipple(){
 const selector='button:not(:disabled),a[onclick],.categories .cat,.product';
 function ripple(event){
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const el=event.target instanceof Element?event.target.closest(selector):null;
  if(!el||el.matches(':disabled')||!document.body.contains(el))return;
  const rect=el.getBoundingClientRect();
  if(!rect.width||!rect.height)return;
  const x=event.clientX&&event.clientY?event.clientX-rect.left:rect.width/2;
  const y=event.clientX&&event.clientY?event.clientY-rect.top:rect.height/2;
  const diameter=Math.hypot(Math.max(x,rect.width-x),Math.max(y,rect.height-y))*2;
  const wave=document.createElement('span');
  wave.className='eurofy-water-ripple';
  wave.setAttribute('aria-hidden','true');
  wave.style.left=x+'px';wave.style.top=y+'px';
  wave.style.setProperty('--eurofy-ripple-scale',String(Math.max(1,diameter/24)));
  el.appendChild(wave);
  wave.addEventListener('animationend',()=>wave.remove(),{once:true});
 }
 document.addEventListener('pointerdown',ripple,{passive:true});
 document.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target instanceof Element&&event.target.closest(selector))ripple({target:event.target,clientX:0,clientY:0})});
})();
