name: Validate EUROFY source
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check backend JavaScript
        run: node --check backend/server.js
      - name: Check inline storefront JavaScript
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import vm from 'node:vm'; const html=fs.readFileSync('index.html','utf8'); const m=html.match(/<script>([\s\S]*?)<\/script>/); if(!m) throw new Error('No script'); new vm.Script(m[1]); console.log('Storefront syntax valid');"
