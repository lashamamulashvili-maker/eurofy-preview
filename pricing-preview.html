<!doctype html><html lang="ka"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EUROFY — ფასების კალკულატორი</title><style>body{font:16px system-ui;background:#f3f6fb;color:#1d2b40;margin:0}main{max-width:800px;margin:35px auto;padding:20px}section{background:white;padding:22px;border-radius:12px;margin:18px 0}input,select,button{font:inherit;padding:10px;margin:8px 0;width:100%;box-sizing:border-box}button{background:#163d81;color:white;border:0;border-radius:6px}label{display:block;margin-top:12px}aside{background:#fff3d1;padding:15px;border-radius:8px}output{font-size:28px;font-weight:700}</style><main><h1>EUROFY — კატეგორიის ფასების კალკულატორი</h1><aside>სატესტო ხელსაწყო. მონაცემები ინახება მხოლოდ ამ ბრაუზერში; მაღაზიის ფასებს არ ცვლის. არ შეიყვანოთ მომხმარებლის პერსონალური მონაცემები.</aside><section><label>კატეგორია<select id="cat"></select></label><label>ნამატის მეთოდი<select id="mode"><option value="percent">პროცენტი (%)</option><option value="eur">ფიქსირებული ნამატი (€)</option><option value="gel">საბოლოო ფასი (₾)</option></select></label><label>ნამატი ან ფასი<input id="value" type="number" min="0" step=".01" value="20"></label><button id="save">ამ კატეგორიის წესის შენახვა</button></section><section><label>მომწოდებლის ფასი (€)<input id="cost" type="number" min="0" step=".01" value="50"></label><label>ტრანსპორტირება (€)<input id="shipping" type="number" min="0" step=".01" value="0"></label><label>1 EUR = GEL<input id="rate" type="number" min=".0001" step=".0001"></label><button id="fetch">ეროვნული ბანკის კურსის მიღება</button><p id="status"></p><p>გამოთვლილი ფასი: <output id="out">—</output></p></section><a href="./admin.html">ადმინისტრატორის კაბინეტში დაბრუნება</a></main><script>
const categories=["SALE","სახლი","მოდა","ელექტრონიკა","აქსესუარები","ფეხსაცმელი","სილამაზე და მოვლა","თავის მოვლის საშუალებები","ჯანმრთელობა და ჰიგიენა","ბავშვები და სათამაშოები","სპორტი და ფიტნესი","ავტომობილი და აქსესუარები","სამზარეულო და ტექნიკა","ავეჯი","ბაღი და ეზო","ინსტრუმენტები და რემონტი","წიგნები და საკანცელარიო","ცხოველების ნივთები","სამგზავრო ნივთები","საათები და სამკაულები","კომპიუტერები და აქსესუარები","ტელეფონები და აქსესუარები"];const $=x=>document.getElementById(x);let rules={};try{rules=JSON.parse(localStorage.getItem("eurofy_preview_category_rules")||"{}")}catch{}categories.forEach(c=>$("cat").add(new Option(c,c)));function load(){const r=rules[$("cat").value]||{mode:"percent",value:20};$("mode").value=r.mode;$("value").value=r.value;calc()}function calc(){const cost=Number($("cost").value),shipping=Number($("shipping").value),rate=Number($("rate").value),v=Number($("value").value);if([cost,shipping,rate,v].some(x=>!Number.isFinite(x)||x<0)||rate<=0){$("out").textContent="შეიყვანეთ სწორი კურსი";return}let p=$("mode").value==="gel"?v:$("mode").value==="eur"?(cost+shipping+v)*rate:(cost*(1+v/100)+shipping)*rate;$("out").textContent=p.toLocaleString("ka-GE",{minimumFractionDigits:2,maximumFractionDigits:2})+" ₾"}$("cat").onchange=load;["mode","value","cost","shipping","rate"].forEach(x=>$(x).oninput=calc);$("save").onclick=()=>{rules[$("cat").value]={mode:$("mode").value,value:Number($("value").value)};localStorage.setItem("eurofy_preview_category_rules",JSON.stringify(rules));$("status").textContent="წესი შენახულია მხოლოდ ამ ბრაუზერში"};$("fetch").onclick=async()=>{try{const res=await fetch("https://nbg.gov.ge/gw/api/ct/monetarypolicy/currencies/ka/json/?currencies=EUR");if(!res.ok)throw Error("API მიუწვდომელია");const json=await res.json();const eur=json[0]?.currencies?.find(x=>x.code==="EUR");if(!eur)throw Error("კურსი ვერ მოიძებნა");$("rate").value=eur.rate;$("status").textContent="ეროვნული ბანკის კურსი · "+(json[0].date||"თარიღი უცნობია");calc()}catch(e){$("status").textContent="კურსი ვერ ჩაიტვირთა: "+e.message+" — შეიყვანეთ ხელით"}};load();
</script></html>
