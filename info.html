<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>EUROFY — ინფორმაცია</title><style>*{box-sizing:border-box}body{margin:0;font:16px/1.65 system-ui,sans-serif;color:#202937;background:#f7f8fa}header,main,footer{max-width:1040px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;background:#163d81;color:white}a{color:#163d81}header a{color:white;font-size:24px;font-weight:700;text-decoration:none}select,button,input,textarea{font:inherit;padding:10px;border:1px solid #ccd4e0;border-radius:6px}main{display:grid;grid-template-columns:250px 1fr;gap:24px}.nav,article{background:white;border:1px solid #e2e7ee;border-radius:12px;padding:20px}.nav a{display:block;padding:5px 0}.badge{display:inline-block;background:#fff1c2;padding:4px 9px;border-radius:99px;font-size:13px}.notice{background:#fff8df;padding:14px;border-left:4px solid #e0ac20}form label{display:block;margin:12px 0}form input,form textarea{display:block;width:100%}button{cursor:pointer;background:#163d81;color:white}details{padding:12px;border-bottom:1px solid #ddd}@media(max-width:700px){main{grid-template-columns:1fr}header{padding:14px} .nav{display:grid;grid-template-columns:repeat(2,1fr);gap:0}.nav a{font-size:14px}}</style></head><body><header><a href="/">EUROFY.ge</a><label><span id="langLabel">ენა</span> <select id="lang" aria-label="ენა"><option value="ka">ქართული</option><option value="en">English</option><option value="uk">Українська</option></select></label></header><main><nav class="nav" id="nav" aria-label="ინფორმაციის გვერდები"></nav><article id="content" aria-live="polite"></article></main><footer><a href="/">EUROFY — მთავარი გვერდი</a></footer><script>
const pages={
about:{ka:['ჩვენ შესახებ','EUROFY არის წინასაშვები პროექტი, რომლის მიზანია საქართველოში მყიდველებს ევროპული საქონლის შერჩევა გაუადვილოს. ვამზადებთ კატალოგს, გამჭვირვალე ფასებს და მიწოდების პროცესს. მომწოდებელთან პარტნიორობა ჯერ დადასტურებული არ არის.'],en:['About EUROFY','EUROFY is a pre-launch project intended to make European product selection easier for customers in Georgia. We are preparing a catalog, transparent pricing, and delivery workflows. No supplier partnership is confirmed yet.'],uk:['Про EUROFY','EUROFY — проєкт на етапі підготовки до запуску, покликаний полегшити покупцям у Грузії вибір європейських товарів. Ми готуємо каталог, прозоре ціноутворення та процеси доставки. Партнерства з постачальниками поки не підтверджені.']},
contact:{ka:['კონტაქტი','გამოიყენეთ ფორმა კითხვებისთვის ან წინასწარი თანამშრომლობის შესახებ. შეტყობინება შეინახება ადგილობრივ განვითარების ბაზაში ადმინისტრატორის განსახილველად. ელფოსტაზე გაგზავნა ამჟამად არ არის ჩართული.'],en:['Contact','Use this form for questions or preliminary partnership inquiries. Messages are stored in the local development database for administrator review. Email delivery is not configured.'],uk:['Контакти','Скористайтеся формою для запитань або попередніх пропозицій про співпрацю. Повідомлення зберігаються в локальній базі розробки для розгляду адміністратором. Надсилання електронною поштою не налаштовано.']},
faq:{ka:['ხშირად დასმული კითხვები','რა არის EUROFY? — საქართველოში მომხმარებლებისთვის განკუთვნილი წინასაშვები მაღაზიის პროექტი.\nსაიდან იქნება პროდუქცია? — იგეგმება ევროპული მომწოდებლების შეთავაზებები; მომწოდებლები და გაყიდვის უფლებები ჯერ დასადასტურებელია.\nროგორ მოხდება მიწოდება? — განიხილება მომწოდებლისგან პირდაპირი მიწოდება ან ევროკავშირში მიღება და შემდგომ საქართველოში გადმოგზავნა. არცერთი მარშრუტი ჯერ გარანტირებული არ არის.\nრა ეღირება და რამდენ ხანს გაგრძელდება? — ტარიფები და ვადები მომწოდებლისა და ლოჯისტიკის დადასტურების შემდეგ განისაზღვრება.\nსაბაჟო შედის ფასში? — ჯერ არ არის განსაზღვრული; საბოლოო წესები წინასწარ გამოქვეყნდება.\nშეკვეთის თვალყურის დევნება და დაბრუნება? — ფუნქციები და პირობები გაშვებამდე უნდა დადასტურდეს.\nროდის გაიხსნება მაღაზია? — თარიღი ჯერ დადგენილი არ არის.'],en:['Frequently asked questions','What is EUROFY? — A pre-launch store project for customers in Georgia.\nWhere will products come from? — European sourcing is planned; suppliers and resale rights are not yet confirmed.\nHow will delivery work? — Direct supplier delivery or EU receiving followed by forwarding to Georgia are being evaluated. Neither route is currently guaranteed.\nWhat will shipping cost and how long will it take? — Rates and estimates depend on confirmed suppliers and logistics.\nAre customs included? — Not determined; final disclosures will be published before sales.\nCan I track or return an order? — These services and terms must be confirmed before launch.\nWhen will the store launch? — No date has been set.'],uk:['Поширені запитання','Що таке EUROFY? — Проєкт магазину на етапі підготовки для покупців у Грузії.\nЗвідки надходитимуть товари? — Планується закупівля в Європі; постачальники й права на перепродаж ще не підтверджені.\nЯк відбуватиметься доставка? — Розглядаються пряма доставка від постачальника або приймання в ЄС із подальшим пересиланням до Грузії. Жоден маршрут поки не гарантований.\nСкільки коштуватиме доставка і скільки триватиме? — Тарифи та строки залежать від підтверджених постачальників і логістики.\nЧи включено митні платежі? — Ще не визначено; остаточні умови буде оприлюднено до початку продажів.\nЧи можна відстежити замовлення або повернути товар? — Послуги й умови потрібно підтвердити до запуску.\nКоли відкриється магазин? — Дату ще не визначено.']},
shipping:{ka:['მიწოდება და ტრანსპორტირება','დაგეგმილი მარშრუტები: ევროპელი მომწოდებელი → მომხმარებელი საქართველოში; ან მომწოდებელი → EUROFY-ის ევროკავშირის მიმღები მისამართი → საქართველოში გადმომგზავრება. მისამართი, გადამზიდავი, ტარიფი, ვადა და საბაჟო პროცესი ჯერ დადასტურებული არ არის.'],en:['Shipping & Delivery','Planned routes: European supplier → customer in Georgia; or supplier → EUROFY EU receiving address → forwarding to Georgia. The address, carrier, rates, delivery times, and customs process are not yet confirmed.'],uk:['Доставка','Заплановані маршрути: європейський постачальник → покупець у Грузії; або постачальник → пункт приймання EUROFY в ЄС → пересилання до Грузії. Адресу, перевізника, тарифи, строки й митні процедури ще не підтверджено.']},
returns:{ka:['დაბრუნება და თანხის დაბრუნება','ეს გვერდი სამუშაო პროექტია და არ ქმნის გაყიდვის მოქმედ პირობებს. დაბრუნების, დეფექტის, არასწორი ნივთის, უარის თქმისა და თანხის დაბრუნების წესები უნდა შემოწმდეს შესაბამის იურისტთან და გამოქვეყნდეს გაყიდვების დაწყებამდე.'],en:['Returns & Refunds','This page is a draft and does not establish operative sales terms. Return, defective-item, incorrect-item, withdrawal, and refund rules require legal review and publication before sales begin.'],uk:['Повернення та відшкодування','Ця сторінка є проєктом і не встановлює чинних умов продажу. Правила повернення, дефектних або помилкових товарів, відмови від покупки й відшкодування слід перевірити з юристом і оприлюднити до початку продажів.']},
payment:{ka:['გადახდის ინფორმაცია','რეალური გადახდები გამორთულია. ბარათის მონაცემები არ მიიღება და არ ინახება. გადახდის მეთოდები და გადახდის მიმწოდებელი ჯერ არ არის შერჩეული.'],en:['Payment Information','Live payments are disabled. Card data is not collected or stored. Payment methods and a payment provider have not been selected.'],uk:['Оплата','Реальні платежі вимкнені. Дані карток не збираються й не зберігаються. Способи оплати та платіжного провайдера ще не обрано.']},
cookies:{ka:['ქუქი-ფაილები და ადგილობრივი საცავი','ეს დემო იყენებს ბრაუზერის localStorage-ს ენის პარამეტრისა და სტუმრის კალათის შესანახად, ხოლო sessionStorage-ს შესვლის სესიის ტოკენისთვის. ანალიტიკისა და სარეკლამო ტრეკერები ამ გვერდზე დამატებული არ არის.'],en:['Cookies & Local Storage','This demo uses browser localStorage for language preference and guest cart, and sessionStorage for the login-session token. No analytics or advertising trackers are added on this page.'],uk:['Файли cookie та локальне сховище','Демо використовує localStorage браузера для мови й кошика гостя, а sessionStorage — для токена сеансу входу. Аналітичні та рекламні трекери на цій сторінці не додані.']},
privacy:{ka:['კონფიდენციალურობა — სამუშაო პროექტი','განვითარების აპში შეიძლება დამუშავდეს ანგარიშის ელფოსტა/სახელი, მიწოდების მისამართი, შეკვეთის მონაცემები და საკონტაქტო შეტყობინება. მონაცემები ადგილობრივ PGlite განვითარების ბაზაში რჩება. საჯარო ჰოსტინგის პროექტი ამ ბაზასთან დაკავშირებული არ არის. შენახვის ვადები და მონაცემთა სუბიექტის პროცედურები ჯერ იურიდიულად შესამოწმებელია.'],en:['Privacy — Draft','The development app may process account email/name, delivery address, order data, and contact messages. Data is stored in the local PGlite development database. The public hosting preview is not connected to this database. Retention periods and data-subject procedures require legal review.'],uk:['Конфіденційність — проєкт','У застосунку розробки можуть оброблятися електронна адреса й ім’я облікового запису, адреса доставки, дані замовлення та контактні повідомлення. Дані зберігаються в локальній базі PGlite для розробки. Публічний хостинг не підключений до цієї бази. Строки зберігання та процедури прав суб’єктів даних потребують юридичної перевірки.']},
terms:{ka:['AGB / ზოგადი პირობები — სამუშაო პროექტი','EUROFY არ იღებს რეალურ შეკვეთებს ან გადახდებს. ეს პროექტი არ წარმოადგენს იურიდიულად დამტკიცებულ პირობებს. შეკვეთის დადება, მიღება, ფასი, გადახდა, მიწოდება, საბაჟო, მომხმარებლის უფლებები, პასუხისმგებლობა და პრეტენზიები უნდა განიხილოს პროფესიონალმა იურისტმა, სანამ გაყიდვები დაიწყება.'],en:['Terms & Conditions (AGB) — Draft','EUROFY does not accept real orders or payments. This draft is not legally approved terms. Order placement and acceptance, prices, payment, delivery, customs, consumer rights, liability, and complaints require professional legal review before sales.'],uk:['Умови продажу (AGB) — проєкт','EUROFY не приймає реальних замовлень або платежів. Цей проєкт не є юридично затвердженими умовами. Оформлення й прийняття замовлень, ціни, оплата, доставка, митні питання, права споживачів, відповідальність і скарги потребують професійної юридичної перевірки до початку продажів.']},
imprint:{ka:['Impressum — შეუვსებელი სამუშაო პროექტი','EUROFY ამჟამად არ არის რეგისტრირებული ბიზნესი. პასუხისმგებელი იურიდიული პირის, მისამართის, წარმომადგენლისა და სავალდებულო რეგისტრაციის მონაცემები დასადასტურებელია. ეს გვერდი არ არის საკმარისი საჯარო სამართლებრივი შეტყობინება და გაყიდვების დაწყებამდე არ უნდა გამოქვეყნდეს როგორც საბოლოო Impressum.'],en:['Impressum — Incomplete Draft','EUROFY is not currently a registered business. The responsible legal operator, address, representative, and required registration details remain unverified. This page is not a sufficient legal notice and must not be presented as a final Impressum before launch.'],uk:['Impressum — незавершений проєкт','EUROFY наразі не є зареєстрованим бізнесом. Відповідальний оператор, адреса, представник і обов’язкові реєстраційні дані не підтверджені. Ця сторінка не є достатнім юридичним повідомленням і не повинна подаватися як остаточний Impressum до запуску.']},
suppliers:{ka:['მომწოდებლებისთვის','EUROFY ამზადებს საქართველოს ბაზარზე ორიენტირებულ წინასაშვებ პროექტს და იკვლევს ევროპულ პროდუქტებს. განიხილება პირდაპირი გზავნილი საქართველოში და ევროკავშირის მისამართზე მიწოდება შემდგომი გადმოგზავნით. გვჭირდება წერილობითი გადაყიდვის/ექსპორტის უფლებები, პროდუქტის ფოტოების ლიცენზიები, მარაგისა და ფასის განახლების წყაროები და მიწოდების პირობები. EUROFY ჯერ არ არის რეგისტრირებული ბიზნესი; კომერციული პარტნიორობა დადასტურებული არ არის.'],en:['Supplier Partnership','EUROFY is a pre-launch project focused on customers in Georgia and is researching European products. Direct shipment to Georgia and EU delivery followed by forwarding are under consideration. Any future onboarding requires written resale/export permissions, image licenses, stock and price feeds, and confirmed delivery terms. EUROFY is not yet a registered business; no commercial partnership is confirmed.'],uk:['Партнерство з постачальниками','EUROFY — проєкт на етапі підготовки, орієнтований на покупців у Грузії, який досліджує європейські товари. Розглядаються пряма доставка до Грузії та доставка в ЄС із подальшим пересиланням. Для майбутнього підключення потрібні письмові дозволи на перепродаж/експорт, ліцензії на зображення, джерела даних про запаси й ціни та підтверджені умови доставки. EUROFY ще не зареєстрований бізнес; комерційне партнерство не підтверджене.']}
};
const ids=['about','contact','faq','shipping','returns','payment','cookies','privacy','terms','imprint','suppliers'];const lang=document.getElementById('lang');let current=localStorage.getItem('eurofy_language')||'ka';if(current==='ru'){current='uk';localStorage.setItem('eurofy_language','uk')}if(!['ka','en','uk'].includes(current))current='ka';lang.value=current;
const names={ka:['ჩვენ შესახებ','კონტაქტი','ხშირი კითხვები','მიწოდება','დაბრუნება','გადახდა','ქუქი-ფაილები','კონფიდენციალურობა','AGB','Impressum','მომწოდებლებისთვის'],en:['About Us','Contact','FAQ','Shipping','Returns','Payment','Cookies','Privacy','Terms','Impressum','Supplier Partnership'],uk:['Про нас','Контакти','Запитання','Доставка','Повернення','Оплата','Файли cookie','Конфіденційність','Умови','Impressum','Постачальникам']};let active=location.hash.slice(1)||'about';
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){document.documentElement.lang=current;const nav=document.getElementById('nav');nav.innerHTML=ids.map((id,i)=>'<a href="#'+id+'">'+esc(names[current][i])+'</a>').join('');const [title,body]=pages[active]?.[current]||pages.about[current];const draft=['terms','imprint','privacy','returns'].includes(active);document.title='EUROFY — '+title;let html='<h1>'+esc(title)+'</h1>'+(draft?'<p class="badge">'+(current==='ka'?'სამუშაო პროექტი — იურიდიული შემოწმება აუცილებელია':current==='en'?'Draft — legal review required':'Проєкт — потрібна юридична перевірка')+'</p>':'')+'<p class="notice">'+esc(current==='ka'?'EUROFY წინასაშვები დემო-პროექტია. რეალური გაყიდვები, გადახდები და მიწოდებები ჩართული არ არის.':current==='en'?'EUROFY is a pre-launch demo. Real sales, payments, and deliveries are not enabled.':'EUROFY — демонстраційний проєкт до запуску. Реальні продажі, платежі та доставки не активовані.')+'</p><div>'+body.split('\n').map(x=>'<p>'+esc(x)+'</p>').join('')+'</div>';if(active==='contact')html+='<form id="contactForm"><label>'+ (current==='ka'?'სახელი':current==='en'?'Name':'Ім’я')+'<input name="name" maxlength="120" required autocomplete="name"></label><label>'+(current==='ka'?'ელფოსტა':current==='en'?'Email':'Електронна пошта')+'<input name="email" type="email" maxlength="254" required autocomplete="email"></label><label>'+(current==='ka'?'თემა':current==='en'?'Subject':'Тема')+'<input name="subject" maxlength="180" required></label><label>'+(current==='ka'?'შეტყობინება':current==='en'?'Message':'Повідомлення')+'<textarea name="message" minlength="10" maxlength="5000" required></textarea></label><label style="position:absolute;left:-10000px" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label><button>'+(current==='ka'?'გაგზავნა':current==='en'?'Submit':'Надіслати')+'</button><p id="contactStatus" role="status"></p></form>';document.getElementById('content').innerHTML=html;document.querySelectorAll('#nav a').forEach(a=>a.onclick=()=>{active=a.hash.slice(1);render()});const form=document.getElementById('contactForm');if(form)form.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form));const status=document.getElementById('contactStatus');try{const r=await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json','Accept-Language':current},body:JSON.stringify(data)});const b=await r.json();if(!r.ok)throw Error(b.error||'Error');status.textContent=current==='ka'?'შეტყობინება შენახულია განსახილველად. ელფოსტაზე არ გაგზავნილა.':current==='en'?'Message saved for review. It was not emailed.':'Повідомлення збережено для розгляду. Електронною поштою його не надіслано.';form.reset()}catch(err){status.textContent=current==='ka'?'შეტყობინება ვერ შეინახა. სცადეთ მოგვიანებით.':current==='en'?'Could not save the message. Please retry later.':'Не вдалося зберегти повідомлення. Спробуйте пізніше.'}}}
lang.onchange=()=>{current=lang.value;localStorage.setItem('eurofy_language',current);render()};window.addEventListener('hashchange',()=>{active=location.hash.slice(1)||'about';render()});render();
</script></body></html>
