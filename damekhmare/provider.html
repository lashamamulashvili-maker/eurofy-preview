<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>დამეხმარე — სპეციალისტის განაცხადი</title><style>body{font-family:system-ui,sans-serif;background:#f3f9ff;color:#163b62;margin:0}header{padding:20px;background:white}main{max-width:720px;margin:32px auto;padding:0 20px}.card{background:white;padding:26px;border:1px solid #dce8f4;border-radius:18px}label{display:block;margin:14px 0;font-weight:600}input,textarea,select{display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:12px;border:1px solid #c2d2e6;border-radius:10px;font:inherit}button{padding:12px 20px;background:#1677df;color:white;border:0;border-radius:12px;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.6}#message{margin-top:18px}a{color:#1677df}</style></head><body><header><strong>♡ დამეხმარე</strong>　<a href="index.html">მთავარი</a>　<a href="requests.html">მომხმარებლის გვერდი</a></header><main><h1>გახდი სპეციალისტი</h1><p>სპეციალისტის პროფილი გამოჩნდება საჯაროდ მხოლოდ ადმინისტრატორის დამტკიცების შემდეგ. ეს გვერდი ლოკალური სატესტო ვერსიაა.</p><div class="card"><form id="login"><h2>შესვლა</h2><label>ელფოსტა<input name="email" type="email" required></label><label>პაროლი<input name="password" type="password" required></label><button>შესვლა</button></form><form id="profile" hidden><h2>პროფილის განაცხადი</h2><label>ქალაქი<input name="city" required minlength="2" maxlength="100"></label><label>მომსახურების ტერიტორია<input name="serviceArea" maxlength="300"></label><label>შენი გამოცდილება<textarea name="bio" maxlength="2000" rows="5"></textarea></label><button>განაცხადის გაგზავნა</button></form><p id="message" role="status"></p></div></main><script>
let token=null;const msg=document.getElementById('message');async function api(url,opts={}){const r=await fetch('/api'+url,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}});const data=await r.json();if(!r.ok)throw Error(data.error||'შეცდომა');return data}
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget;const data=Object.fromEntries(new FormData(form));try{const result=await api('/login',{method:'POST',body:JSON.stringify(data)});token=result.token;form.reset();form.hidden=true;document.getElementById('profile').hidden=false;msg.textContent='შესვლა წარმატებულია'}catch(err){msg.textContent=err.message}});
document.getElementById('profile').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget;try{const result=await api('/provider/profile',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});msg.textContent='განაცხადი შენახულია. სტატუსი: '+result.profile.verification_status}catch(err){msg.textContent=err.message}});
</script></body></html>
