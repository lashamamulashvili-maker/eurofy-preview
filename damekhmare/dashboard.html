<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>დამეხმარე — სამუშაო სივრცე</title><style>body{font:16px system-ui,sans-serif;margin:0;background:#f3f8fe;color:#173c63}header{background:white;padding:20px;border-bottom:1px solid #dce8f6}main{max-width:980px;margin:30px auto;padding:0 20px}.card{background:white;border:1px solid #dce8f6;border-radius:18px;padding:22px;margin:18px 0}label{display:block;margin:12px 0}input,select,textarea{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #bdcfe2;border-radius:9px;font:inherit}button{padding:10px 17px;border:0;border-radius:10px;background:#1877d3;color:white;margin:6px 7px 6px 0;cursor:pointer}button:disabled{opacity:.5}.item{border-top:1px solid #e5edf6;padding:16px 0;overflow-wrap:anywhere}a{color:#1877d3}small{color:#607b99}#workspace{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header><strong>♡ დამეხმარე</strong>　<a href="index.html">მთავარი</a>　<a href="requests.html">მოთხოვნები</a>　<a href="provider.html">სპეციალისტი</a></header><main><h1>ჩემი სამუშაო სივრცე</h1><p>უფასო სატესტო ვერსია. გადახდები არ გამოიყენება.</p><section id="login-card" class="card"><h2>შესვლა</h2><form id="login"><label>ელფოსტა<input name="email" type="email" required autocomplete="username"></label><label>პაროლი<input name="password" type="password" required autocomplete="current-password"></label><button>შესვლა</button></form></section><div id="workspace"><button id="logout">გამოსვლა</button><div class="grid"><section class="card"><h2>ჩემი მოთხოვნები</h2><button id="refresh-requests">განახლება</button><div id="my-requests"></div></section><section class="card"><h2>ჩემი გაგზავნილი შეთავაზებები</h2><button id="refresh-offers">განახლება</button><div id="my-offers"></div></section></div><div class="grid"><section class="card"><h2>ჩემი დაჯავშნები</h2><button id="refresh-bookings">განახლება</button><div id="bookings"></div></section><section class="card"><h2>ჩემი შეთავაზებები</h2><p><small>შეთავაზებები მხოლოდ საკუთარ მოთხოვნებზე ჩანს.</small></p><form id="offers-form"><label>მოთხოვნის ID<input name="requestId" required placeholder="UUID"></label><button>შეთავაზებების ნახვა</button></form><div id="offers"></div></section></div><section class="card"><h2>პირადი მიმოწერა</h2><form id="messages-form"><label>დაჯავშნის ID<input name="bookingId" required></label><button>შეტყობინებების ნახვა</button></form><div id="messages"></div><form id="send-form"><label>შეტყობინება<textarea name="body" minlength="1" maxlength="4000" required></textarea></label><button>გაგზავნა</button></form></section></div><p id="status" role="status" aria-live="polite"></p></main><script>
let token=null,activeBooking=null;const $=id=>document.getElementById(id);const msg=s=>$('status').textContent=s;
async function api(url,options={}){const response=await fetch('/api'+url,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}});const data=response.status===204?{}:await response.json();if(!response.ok)throw Error(data.error||'შეცდომა');return data}
function field(form,key){return new FormData(form).get(key)?.toString().trim()||''}
function item(target,heading,details){const div=document.createElement('div');div.className='item';const h=document.createElement('h3');h.textContent=heading;const p=document.createElement('p');p.textContent=details;div.append(h,p);target.append(div);return div}
$('login').addEventListener('submit',async e=>{e.preventDefault();try{const form=e.currentTarget;const data=await api('/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});token=data.token;form.reset();$('login-card').style.display='none';$('workspace').style.display='block';msg('მოგესალმებით, '+data.user.displayName);await Promise.all([loadBookings(),loadRequests(),loadOffers()])}catch(err){msg(err.message)}});
$('logout').addEventListener('click',async()=>{try{await api('/logout',{method:'POST'})}catch{}token=null;activeBooking=null;$('workspace').style.display='none';$('login-card').style.display='block';msg('გამოხვედით')});
async function loadRequests(){const target=$('my-requests');target.replaceChildren();try{const {requests}=await api('/my/requests');if(!requests.length)target.textContent='მოთხოვნები არ არის';for(const r of requests){const d=item(target,r.title,r.city+' · '+r.status);const b=document.createElement('button');b.textContent='შეთავაზებების ნახვა';b.addEventListener('click',()=>{$('offers-form').elements.requestId.value=r.id;$('offers-form').requestSubmit()});d.append(b)}}catch(err){msg(err.message)}}
async function loadOffers(){const target=$('my-offers');target.replaceChildren();try{const {offers}=await api('/my/offers');if(!offers.length)target.textContent='შეთავაზებები არ არის';for(const o of offers)item(target,o.title,(o.amount_gel_minor/100).toFixed(2)+' GEL · '+o.status)}catch(err){msg(err.message)}}
$('refresh-requests').addEventListener('click',loadRequests);$('refresh-offers').addEventListener('click',loadOffers);
async function loadBookings(){const target=$('bookings');target.replaceChildren();try{const {bookings}=await api('/bookings');if(!bookings.length)target.textContent='დაჯავშნები არ არის';for(const b of bookings){const div=item(target,b.title,b.city+' · '+b.status+' · '+b.participation+' · '+new Date(b.scheduled_for).toLocaleString('ka-GE'));const copy=document.createElement('button');copy.textContent='ID-ის კოპირება';copy.addEventListener('click',()=>navigator.clipboard?.writeText(b.id));div.append(copy);const choices=b.participation==='provider'&&b.status==='requested'?['confirmed','cancelled']:b.participation==='customer'&&b.status==='confirmed'?['completed','cancelled']:['requested','confirmed'].includes(b.status)?['cancelled']:[];for(const status of choices){const btn=document.createElement('button');btn.textContent=({confirmed:'დადასტურება',completed:'დასრულება',cancelled:'გაუქმება'})[status];btn.addEventListener('click',async()=>{if(!confirm('შევცვალოთ სტატუსი?'))return;try{await api('/bookings/'+encodeURIComponent(b.id)+'/status',{method:'PATCH',body:JSON.stringify({status})});await loadBookings()}catch(err){msg(err.message)}});div.append(btn)}}}catch(err){msg(err.message)}}
$('refresh-bookings').addEventListener('click',loadBookings);
$('offers-form').addEventListener('submit',async e=>{e.preventDefault();const id=field(e.currentTarget,'requestId');const target=$('offers');target.replaceChildren();try{const {offers}=await api('/requests/'+encodeURIComponent(id)+'/offers');if(!offers.length)target.textContent='შეთავაზებები არ არის';for(const o of offers){const div=item(target,o.provider_name,(o.amount_gel_minor/100).toFixed(2)+' GEL · '+o.status+' · '+o.note);if(o.status==='pending'){const date=document.createElement('input');date.type='datetime-local';date.setAttribute('aria-label','დაჯავშნის თარიღი');div.append(date);const btn=document.createElement('button');btn.textContent='მიღება და დაჯავშნა';btn.addEventListener('click',async()=>{if(!date.value)return msg('აირჩიეთ თარიღი');try{await api('/offers/'+encodeURIComponent(o.id)+'/accept',{method:'POST',body:JSON.stringify({scheduledFor:new Date(date.value).toISOString()})});msg('დაჯავშნა შეიქმნა');await loadBookings()}catch(err){msg(err.message)}});div.append(btn)}}}catch(err){msg(err.message)}});
async function loadMessages(){if(!activeBooking)return;const target=$('messages');target.replaceChildren();try{const {messages}=await api('/bookings/'+encodeURIComponent(activeBooking)+'/messages');if(!messages.length)target.textContent='შეტყობინებები არ არის';for(const m of messages)item(target,new Date(m.created_at).toLocaleString('ka-GE'),m.body)}catch(err){msg(err.message)}}
$('messages-form').addEventListener('submit',async e=>{e.preventDefault();activeBooking=field(e.currentTarget,'bookingId');await loadMessages()});
$('send-form').addEventListener('submit',async e=>{e.preventDefault();if(!activeBooking)return msg('ჯერ აირჩიეთ დაჯავშნა');try{await api('/bookings/'+encodeURIComponent(activeBooking)+'/messages',{method:'POST',body:JSON.stringify({body:field(e.currentTarget,'body')})});e.currentTarget.reset();await loadMessages()}catch(err){msg(err.message)}});
</script></body></html>
