<!doctype html><html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>დამეხმარე — ადმინისტრატორი</title><style>body{margin:0;background:#f3f8ff;color:#183858;font:16px system-ui,sans-serif}header{background:white;padding:18px 24px;border-bottom:1px solid #dce7f4}main{max-width:900px;margin:30px auto;padding:0 20px}section{background:white;border:1px solid #dce7f4;border-radius:18px;padding:24px;margin-bottom:22px}label{display:block;margin:12px 0}input{display:block;padding:12px;width:100%;max-width:450px;box-sizing:border-box;border:1px solid #bccde0;border-radius:10px;font:inherit}button{background:#1475d4;color:white;border:0;border-radius:9px;padding:11px 16px;cursor:pointer;margin:8px 8px 0 0}button.secondary{background:#64748b}button.danger{background:#a63e38}button:disabled{opacity:.5}.card{border-top:1px solid #e3ebf4;padding:18px 0;overflow-wrap:anywhere}.muted{color:#657d96}#panel{display:none}a{color:#1475d4}</style></head><body><header><strong>♡ დამეხმარე</strong>　<a href="index.html">მთავარი</a></header><main><h1>ადმინისტრატორის სამუშაო სივრცე</h1><p class="muted">მხოლოდ ლოკალური განვითარების გარემოსთვის. ადმინისტრატორის უფლება არ გაიცემა ამ გვერდიდან.</p><section id="login-panel"><h2>შესვლა</h2><form id="login"><label>ელფოსტა<input type="email" name="email" autocomplete="username" required></label><label>პაროლი<input type="password" name="password" autocomplete="current-password" required></label><button>შესვლა</button></form></section><section id="panel"><h2>დასამტკიცებელი სპეციალისტები</h2><button id="refresh">განახლება</button><button id="logout" class="secondary">გამოსვლა</button><div id="pending" aria-live="polite"></div></section><p id="status" role="status" aria-live="polite"></p></main><script>
let token=null;const status=document.getElementById('status');const pending=document.getElementById('pending');
function message(t){status.textContent=t}
async function api(route,options={}){const response=await fetch('/api'+route,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}});const data=response.status===204?{}:await response.json();if(!response.ok)throw Error(data.error||'მოთხოვნა ვერ შესრულდა');return data}
async function refresh(){pending.replaceChildren();try{const result=await api('/admin/pending-providers');if(!result.providers.length){pending.textContent='ახალი განაცხადები არ არის';return}for(const p of result.providers){const card=document.createElement('article');card.className='card';const title=document.createElement('h3');title.textContent=p.display_name+' — '+p.city;const email=document.createElement('p');email.textContent='ელფოსტა: '+p.email;const bio=document.createElement('p');bio.textContent=p.bio||'აღწერა არ არის';const area=document.createElement('p');area.textContent='ტერიტორია: '+(p.service_area||'არ არის მითითებული');card.append(title,email,bio,area);for(const [label,decision,css] of [['დამტკიცება','approved',''],['უარყოფა','rejected','danger']]){const btn=document.createElement('button');btn.textContent=label;btn.className=css;btn.addEventListener('click',async()=>{if(!confirm('დარწმუნებული ხართ?'))return;btn.disabled=true;try{await api('/admin/providers/'+encodeURIComponent(p.account_id)+'/verification',{method:'PATCH',body:JSON.stringify({status:decision})});message('განაცხადის სტატუსი განახლდა');await refresh()}catch(err){message(err.message);btn.disabled=false}});card.append(btn)}pending.append(card)}}catch(err){message(err.message)}}
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget;try{const result=await api('/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});token=result.token;await api('/admin/pending-providers');form.reset();document.getElementById('login-panel').style.display='none';document.getElementById('panel').style.display='block';message('ადმინისტრატორის სესია აქტიურია');await refresh()}catch(err){token=null;message(err.message)}});
document.getElementById('refresh').addEventListener('click',refresh);
document.getElementById('logout').addEventListener('click',async()=>{try{await api('/logout',{method:'POST'})}catch{}token=null;pending.replaceChildren();document.getElementById('panel').style.display='none';document.getElementById('login-panel').style.display='block';message('გამოხვედით')});
</script></body></html>
